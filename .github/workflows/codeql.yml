name: codeql.yml

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 0'

permissions:
  security-events: write
  contents: read

jobs:
  call-central-codeql-javascript-typescript-frontend:
    uses: Code-Syndicate-Latam/org-security/.github/workflows/codeql_java_backend.yaml@main
    permissions: inherit
    secrets: inherit
    with:
      config-file: .github/codeql/codeql-config.yaml
